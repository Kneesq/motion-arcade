<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7fc">
  <title>Motion Arcade · 体感游戏大厅</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dance.css">
  <link rel="stylesheet" href="game-options.css">
  <link rel="preload" as="image" href="assets/balloon.webp">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-pad" viewBox="0 0 24 24"><path d="M7.2 6.5h9.6c2.2 0 3.4 1.4 4 4.4l1 5.2c.5 2.8-2.2 4.2-4.2 2.4l-2.8-2.6H9.2l-2.8 2.6c-2 1.8-4.7.4-4.2-2.4l1-5.2c.6-3 1.8-4.4 4-4.4Z"/><path d="M6 11h5m-2.5-2.5v5m7.5-.5h.01M18 10h.01"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 0 1 4.7.6c0 1.8-2.4 2.1-2.4 4.1m0 3h.01"/></symbol>
    <symbol id="i-cast" viewBox="0 0 24 24"><path d="M3 8V5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v12a1.5 1.5 0 0 1-1.5 1.5H15M3 12a8 8 0 0 1 8 8m-8-4a4 4 0 0 1 4 4m-4 0h.01"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-14.7a3 3 0 0 1 0 5.4M18 14a5 5 0 0 1 3 4.6V20"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M7 12V7a1.5 1.5 0 0 1 3 0v4-6a1.5 1.5 0 0 1 3 0v6-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-13 4l-3-5a1.5 1.5 0 0 1 2.5-1.6L7 14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 7h5m5 0h8M3 17h10m5 0h3"/><circle cx="10.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m10 3 1.8 5.4L17 10l-5.2 1.6L10 17l-1.8-5.4L3 10l5.2-1.6L10 3Zm9 10 .9 2.9L23 17l-3.1 1L19 21l-1-3-3-1 3-1.1L19 13Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.7c0-1.2 1.3-1.9 2.3-1.2l12 7.3c.9.6.9 1.9 0 2.5l-12 7.3c-1 .7-2.3 0-2.3-1.2Z"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="4"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9l5 6m0-6-5 6"/></symbol>
  </svg>
  <div id="lobby">
    <header class="topbar"><div class="bar-inner">
      <a class="brand" href="#lobby" aria-label="Motion Arcade 首页"><img src="assets/mark.svg" alt="" width="43" height="43"><span>Motion<span class="brand-accent">Arcade</span></span></a>
      <nav aria-label="主导航"><a class="nav-link active" href="#games"><svg><use href="#i-grid"/></svg>游戏大厅</a><button class="nav-link" data-dialog="guide"><svg><use href="#i-help"/></svg>游玩指南</button></nav>
      <button class="cast-button" data-dialog="cast"><svg><use href="#i-cast"/></svg>投屏到电视</button>
    </div></header>
    <main class="home">
      <section id="hero" class="hero balloon" aria-label="精选游戏">
        <img id="hero-art" class="hero-art" src="assets/balloon.webp" alt="" fetchpriority="high">
        <div class="hero-copy"><span class="featured"><svg><use href="#i-spark"/></svg>精选游戏</span>
          <p class="hero-en" id="hero-en">BALLOON POP</p><h1 id="hero-title">气球爆破</h1>
          <p class="hero-desc" id="hero-desc">挥动双手，戳破从天而降的气球和泡泡！</p>
          <button class="primary hero-play" id="hero-play"><svg><use href="#i-play"/></svg>开始游戏</button>
        </div>
        <div class="carousel"><button id="prev" aria-label="上一个精选游戏"><svg><use href="#i-left"/></svg></button><span id="hero-count">01 <i>/</i> 03</span><button id="next" aria-label="下一个精选游戏"><svg><use href="#i-right"/></svg></button></div>
      </section>
      <section id="games" aria-labelledby="library-title"><div class="section-head"><div><div class="section-title"><span class="grid-icon"><svg><use href="#i-grid"/></svg></span><h2 id="library-title">游戏大厅</h2></div><p>选一个游戏，让身体变成控制器。</p></div><div class="lobby-tools"><button type="button" class="settings-button" data-sound-toggle aria-label="游戏声音" aria-pressed="true"><svg><use href="#i-sound"/></svg><span>声音开</span></button><button class="settings-button" id="settings"><svg><use href="#i-settings"/></svg>游玩设置</button></div></div>
        <div class="game-cards" id="cards"></div>
      </section>
    </main>
    <footer><span><svg><use href="#i-pad"/></svg> Motion Arcade</span><button data-dialog="guide">相机使用说明</button></footer>
  </div>
  <section id="stage" hidden aria-label="游戏画面">
    <div class="gamebar"><button id="exit-game"><svg><use href="#i-left"/></svg>大厅</button><strong id="stage-title"></strong><div class="gamebar-tools"><span id="session-mode">触控试玩</span><small id="camera-count" hidden></small><button data-dialog="cast" aria-label="投屏到电视"><svg><use href="#i-cast"/></svg></button><button id="fullscreen" aria-label="全屏"><svg><use href="#i-max"/></svg></button><button id="pause" aria-label="暂停"><svg><use href="#i-pause"/></svg></button></div></div>
    <div class="surface"><div id="playfield"><video id="camera" muted autoplay playsinline disablepictureinpicture aria-label="实时相机画面" hidden></video><canvas id="screen" aria-label="体感游戏场景"></canvas></div></div>
    <div id="controls" hidden></div>
    <div class="overlay" id="intermission" hidden><div class="overlay-card"><h2 id="inter-title"></h2><p id="inter-desc" aria-live="polite"></p><div id="scores"></div><div id="inter-actions"></div></div></div>
  </section>
  <dialog id="panel" aria-labelledby="panel-title"><div class="dialog-inner"><div class="dialog-head"><h2 id="panel-title"></h2><button id="close" class="icon-button" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div id="setup-content" hidden><div class="chosen-game" id="chosen-game"></div>
      <div class="setup-sound"><span>游戏声音</span><button type="button" class="settings-button" data-sound-toggle aria-label="游戏声音" aria-pressed="true"><svg><use href="#i-sound"/></svg><span>声音开</span></button></div>
      <fieldset><legend>玩家人数</legend><div class="segments" data-opt="players"><button data-value="1">1 人</button><button data-value="2">2 人</button><button data-value="3">3 人</button><button data-value="4">4 人</button></div></fieldset>
      <fieldset><legend>手机镜头</legend><div class="segments" data-opt="camera"><button data-value="user">前置镜头</button><button data-value="environment">后置镜头</button></div></fieldset>
      <fieldset><legend>动作侦测</legend><div class="segments" data-opt="points"><button data-value="2">双手 · 2 点</button><button data-value="4">双手双脚 · 4 点</button></div></fieldset>
      <div id="game-options"></div>
      <div id="dance-editor-wrap" hidden><div id="dance-editor"></div></div>
      <p class="privacy"><svg><use href="#i-camera"/></svg>相机画面就是游戏背景。请让所有玩家完整入镜，影像只在本机处理。</p>
      <div class="setup-actions"><button class="primary" id="camera-start"><svg><use href="#i-camera"/></svg>开启相机游玩</button><button class="secondary" id="demo-start">触控试玩</button></div>
    </div>
    <div id="info-content" hidden></div>
  </div></dialog>
  <noscript>请启用 JavaScript，以载入游戏大厅和动作侦测。</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
